# Prometheus 配置文件 - 鹰眼监控系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'eaglee-monitor'
    environment: 'production'

# 规则文件
rule_files:
  - "rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # 鹰眼监控系统应用
  - job_name: 'eaglee-app'
    static_configs:
      - targets: ['eaglee-app:9090']
    scrape_interval: 15s
    metrics_path: /eaglee/actuator/prometheus
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # MySQL 监控（需要 mysqld_exporter）
  - job_name: 'mysql'
    static_configs:
      - targets: ['eaglee-mysql:3306']
    scrape_interval: 30s
    metrics_path: /metrics
    # 如果使用 mysqld_exporter
    # static_configs:
    #   - targets: ['mysqld-exporter:9104']

  # Redis 监控（需要 redis_exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['eaglee-redis:6379']
    scrape_interval: 30s
    metrics_path: /metrics
    # 如果使用 redis_exporter
    # static_configs:
    #   - targets: ['redis-exporter:9121']

  # 系统监控（需要 node_exporter）
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #   scrape_interval: 30s

# 告警管理器配置
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# 存储配置
storage:
  tsdb:
    path: /prometheus
    retention.time: 30d
    retention.size: 10GB